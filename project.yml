# XcodeGen spec. CI runs `xcodegen generate`; the .xcodeproj is not committed.
# The app is Background Sync for Immich ("BG Sync" on the home screen); target names and bundle IDs keep
# the first name, "ImmichBackup".
# Bundle IDs below are FIXED: every new ID costs one of the free account's App IDs.
name: ImmichBackup
options:
  bundleIdPrefix: com.difei
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ImmichBackup:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: UploadExtension
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.difei.immichbackup]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BG Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Background Sync keeps your photos in sync with your Immich server, uploading new ones and syncing deletions.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.difei.immichbackup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  UploadExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - UploadExtension
      - Shared
    entitlements:
      path: UploadExtension/UploadExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.difei.immichbackup]
    info:
      path: UploadExtension/Info.plist
      properties:
        CFBundleDisplayName: BG Sync Upload
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Apple requires this for "network access validation"; it is not the upload URL
        # (uploads go to the server set in the app, as with Nextcloud's cloud.nextcloud.com).
        BackgroundUploadURLBase: https://photos.example.com
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.difei.immichbackup.upload
