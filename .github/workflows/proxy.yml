name: Proxy

on:
  push:
    paths: ["proxy/**", ".github/workflows/proxy.yml"]
    tags: ["v*"]  # also publishes ghcr.io/<owner>/immich-sync-proxy (paths don't apply to tags)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
      - run: go vet ./... && go test ./...

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/immich-sync-proxy:latest
            ghcr.io/${{ github.repository_owner }}/immich-sync-proxy:${{ github.ref_name }}
