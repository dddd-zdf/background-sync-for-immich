name: iOS build

on:
  push:
    branches: [main]
    paths: ["App/**", "UploadExtension/**", "Shared/**", "project.yml", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Preview image with the iOS 27 SDK (the regular macOS images stop at Xcode 26).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ImmichBackup.xcodeproj -scheme ImmichBackup -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/ImmichBackup.app

      # SideStore re-signs the app on the phone, but it reads the entitlements (app group)
      # from the binaries, so sign ad hoc with them first. Inner bundles before the outer one.
      - name: Package IPAs
        run: |
          set -ex
          APP=build/Build/Products/Release-iphoneos/ImmichBackup.app
          sign() { codesign -f -s - --generate-entitlement-der --entitlements "$2" "$1"; }

          # Variant A: standard layout, extension in Extensions/ (what Xcode produces).
          mkdir -p out/a/Payload && cp -R "$APP" out/a/Payload/
          A=out/a/Payload/ImmichBackup.app
          sign "$A/Extensions/UploadExtension.appex" UploadExtension/UploadExtension.entitlements
          sign "$A" App/App.entitlements
          (cd out/a && zip -qry ../ImmichBackup-extensions.ipa Payload)

          # Variant B: extension moved to PlugIns/, the only folder SideStore's signer scans.
          mkdir -p out/b/Payload && cp -R "$APP" out/b/Payload/
          B=out/b/Payload/ImmichBackup.app
          mkdir -p "$B/PlugIns" && mv "$B/Extensions/UploadExtension.appex" "$B/PlugIns/" && rmdir "$B/Extensions"
          sign "$B/PlugIns/UploadExtension.appex" UploadExtension/UploadExtension.entitlements
          sign "$B" App/App.entitlements
          (cd out/b && zip -qry ../ImmichBackup-plugins.ipa Payload)

          find out/a/Payload -maxdepth 3 | sort
          codesign -d --entitlements - "$A/Extensions/UploadExtension.appex"
          plutil -p "$A/Extensions/UploadExtension.appex/Info.plist"
          ls -la out/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: out/*.ipa
          retention-days: 30

      - name: Build log on failure
        if: failure()
        run: grep -B2 -A8 "error:" build.log | head -200 || tail -200 build.log
