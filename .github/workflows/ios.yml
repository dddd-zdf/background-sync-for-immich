name: iOS build

on:
  push:
    branches: [main]
    paths: ["App/**", "UploadExtension/**", "Shared/**", "project.yml", ".github/workflows/ios.yml"]
    tags: ["v*"]  # also attaches the IPA to a GitHub release (paths don't apply to tags)
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    # Preview image with the iOS 27 SDK (the regular macOS images stop at Xcode 26).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ImmichBackup.xcodeproj -scheme ImmichBackup -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          test -d build/Build/Products/Release-iphoneos/ImmichBackup.app

      # SideStore re-signs the app on the phone, but it reads the entitlements (app group)
      # from the binaries, so sign ad hoc with them first. Inner bundle before the outer one.
      # Installing needs SideStore with the Extensions/ signing fix (see README).
      - name: Package IPA
        run: |
          set -ex
          mkdir -p out/Payload && cp -R build/Build/Products/Release-iphoneos/ImmichBackup.app out/Payload/
          APP=out/Payload/ImmichBackup.app
          codesign -f -s - --generate-entitlement-der --entitlements UploadExtension/UploadExtension.entitlements "$APP/Extensions/UploadExtension.appex"
          codesign -f -s - --generate-entitlement-der --entitlements App/App.entitlements "$APP"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd out && zip -qry "BackgroundSync-$VERSION.ipa" Payload)
          codesign -d --entitlements - "$APP/Extensions/UploadExtension.appex"
          ls -la out/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: out/*.ipa
          retention-days: 30

      # Stable channel: a v* tag makes a release; its source.json is .../releases/latest/download/source.json
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          IPA=$(ls out/*.ipa)
          python3 scripts/sidestore-source.py stable "${{ github.ref_name }}" "$IPA" notes.md out/source.json
          gh release create "${{ github.ref_name }}" "$IPA" out/source.json --title "${{ github.ref_name }}" --notes-file notes.md

      # Nightly channel: every build of main replaces the IPA and source.json on the "nightly"
      # prerelease (.../releases/download/nightly/source.json). Prereleases never count as "latest".
      - name: Nightly
        # main, or a manual run on another branch to try it out before merging
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          git tag -f nightly && git push -f origin refs/tags/nightly
          {
            echo "Build ${{ github.run_number }} from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
            echo
            echo "Install through the nightly SideStore source (see README). Not a stable release."
          } > notes.md
          cp "$(ls out/BackgroundSync-*.ipa | head -1)" out/BackgroundSync-nightly.ipa
          python3 scripts/sidestore-source.py nightly nightly out/BackgroundSync-nightly.ipa notes.md out/source.json
          gh release view nightly > /dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly" --notes-file notes.md
          gh release edit nightly --prerelease --notes-file notes.md
          gh release upload nightly out/BackgroundSync-nightly.ipa out/source.json --clobber

      - name: Build log on failure
        if: failure()
        run: grep -B2 -A8 "error:" build.log | head -200 || tail -200 build.log
